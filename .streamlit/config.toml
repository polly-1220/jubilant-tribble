# Налаштування Streamlit для ReBuildDrone
[browser]
# Не надсилати статистику в інтернет: застосунок має працювати офлайн
gatherUsageStats = false

[client]
# Сховати кнопку «Deploy» і меню розробника (застосунок працює локально)
toolbarMode = "minimal"

[server]
# Порт, на якому відкривається застосунок
port = 8501
# Віддавати файли з папки static/ (3D-модель, шрифти) за адресою /app/static/
enableStaticServing = true

# ---------- Дизайн: світла яскрава тема ----------
[theme]
base = "light"
primaryColor = "#7C5CFF"            # фіолетовий — головні кнопки і повзунки
backgroundColor = "#FFFBF4"         # теплий кремовий фон
secondaryBackgroundColor = "#F3EDFF" # лавандовий — поля вводу, бічна панель
textColor = "#221B38"
borderColor = "#2A2342"
linkColor = "#7C5CFF"
greenColor = "#16B877"
yellowColor = "#F5A700"
redColor = "#FF4D6D"
blueColor = "#3D8BFF"
violetColor = "#7C5CFF"
orangeColor = "#FF8A3D"
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
font = "Manrope, sans-serif"
headingFont = "Unbounded, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]

# Шрифти лежать у static/fonts (ліцензія SIL OFL) — інтернет не потрібен
[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/manrope-latin.woff2"
weight = "200 800"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/manrope-cyrillic.woff2"
weight = "200 800"
unicodeRange = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"

[[theme.fontFaces]]
family = "Unbounded"
url = "app/static/fonts/unbounded-latin.woff2"
weight = "200 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Unbounded"
url = "app/static/fonts/unbounded-cyrillic.woff2"
weight = "200 900"
unicodeRange = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"

[theme.sidebar]
backgroundColor = "#F1EAFF"
